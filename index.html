<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>75 Dias</title>
<style>
  :root {
    --ink: #1c1a17;
    --ink2: #55504a;
    --ink3: #8a837b;
    --bg: #faf8f5;
    --line: #e5e0d8;
    --accent: #8a6a4a;
  }
  @media (prefers-color-scheme: dark) {
    :root { --ink:#f2efe9; --ink2:#c3bcb2; --ink3:#8a837b; --bg:#141311; --line:#2b2825; --accent:#c9a17a; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 17px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  main { max-width: 42rem; margin: 0 auto; padding: 3rem 1.25rem 5rem; }
  h1 { font-size: 2rem; line-height: 1.2; letter-spacing: -0.02em; margin: 0 0 .35rem; }
  h2 { font-size: 1.15rem; letter-spacing: -0.01em; margin: 2.75rem 0 .6rem; }
  h3 { font-size: 1rem; margin: 1.75rem 0 .4rem; }
  p, li { color: var(--ink2); }
  .lead { font-size: 1.1rem; color: var(--ink); }
  .meta { color: var(--ink3); font-size: .9rem; margin: 0 0 2.5rem; }
  ul { padding-left: 1.15rem; }
  li { margin: .35rem 0; }
  table { width: 100%; border-collapse: collapse; margin: 1rem 0; font-size: .95rem; display: block; overflow-x: auto; }
  th, td { text-align: left; padding: .6rem .5rem; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--ink); font-weight: 600; }
  td { color: var(--ink2); }
  a { color: var(--accent); }
  hr { border: 0; border-top: 1px solid var(--line); margin: 3.5rem 0; }
  .box { border: 1px solid var(--line); border-radius: 12px; padding: 1rem 1.15rem; margin: 1.5rem 0; }
  .box p:last-child { margin-bottom: 0; }
  footer { color: var(--ink3); font-size: .9rem; margin-top: 3rem; }
</style>
</head>
<body>
<main>

<h1>75 Dias</h1>
<p class="meta">Uma app para o desafio de 75 dias.</p>

<p class="lead">Esta página tem a política de privacidade e o apoio da app.</p>

<ul>
  <li><strong>Português</strong> — <a href="privacidade/">Política de privacidade</a> · <a href="suporte/">Apoio</a></li>
  <li><strong>English</strong> — <a href="privacidade-en/">Privacy policy</a> · <a href="suporte-en/">Support</a></li>
  <li><strong>Español</strong> — <a href="privacidade-es/">Política de privacidad</a> · <a href="suporte-es/">Ayuda</a></li>
</ul>

<hr>

<footer>
  <p>Contacto: <a href="mailto:manifestbyemabeatriz@gmail.com">manifestbyemabeatriz@gmail.com</a></p>
</footer>

</main>
</body>
</html>
